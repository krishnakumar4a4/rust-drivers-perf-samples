name: Runtime benchmark

on:
  push:
    branches:
      - github-action-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout performance samples
        uses: actions/checkout@v5
      - name: Enable long Git paths
        run: git config --global core.longpaths true
      - name: Checkout custom Rust compiler
        uses: actions/checkout@v5
        with:
          repository: gurry/rust
          ref: 8a0ad0dea37c2692810b183d3c4aee60cb5f228f
          path: r
          fetch-depth: 0
      - name: Install nightly Cargo
        uses: dtolnay/rust-toolchain@nightly
      - name: Build and install stage1
        working-directory: r
        run: |
          @'
          change-id = "ignore"
          [llvm]
          download-ci-llvm = true
          [rust]
          download-rustc = false
          channel = "nightly"
          optimize = true
          debug-assertions = false
          debuginfo-level = 0
          incremental = false
          '@ | Set-Content bootstrap.toml
          python x.py build --stage 1 library
          if ($LASTEXITCODE -ne 0) { throw "stage1 build failed" }
          rustup toolchain link stage1 "$PWD\build\x86_64-pc-windows-msvc\stage1"
          if ($LASTEXITCODE -ne 0) { throw "stage1 installation failed" }
          rustc +stage1 --version --verbose
          cargo +stage1 --version
      - name: Run WPP runtime benchmark
        run: |
          $manifest = ".\runtime-bench\Cargo.toml"
          cargo +stage1 bench --color always --manifest-path $manifest --bench trace -- --color always
      - name: Run CodeView annotation release benchmark
        run: |
          $manifest = ".\runtime-bench\Cargo.toml"
          cargo +stage1 bench --color always --manifest-path $manifest --bench codeview_annotation --profile release -- --color always --save-baseline release
      - name: Run CodeView annotation debug benchmark
        run: |
          $manifest = ".\runtime-bench\Cargo.toml"
          cargo +stage1 bench --color always --manifest-path $manifest --bench codeview_annotation --profile dev -- --color always --baseline release
      - name: Upload Criterion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-benchmark-results
          path: runtime-bench/target/criterion
          if-no-files-found: warn
