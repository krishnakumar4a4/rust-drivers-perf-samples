name: Runtime benchmark

on:
  push:
    branches:
      - github-action-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout performance samples
        uses: actions/checkout@v5
      - name: Enable long Git paths
        run: git config --global core.longpaths true
      - name: Install latest nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Run WPP runtime benchmark
        run: |
          $manifest = ".\runtime-bench\Cargo.toml"
          cargo +nightly bench --color always --manifest-path $manifest --bench trace -- --color always
      - name: Run CodeView annotation release benchmark
        run: |
          $manifest = ".\runtime-bench\Cargo.toml"
          cargo +nightly bench --color always --manifest-path $manifest --bench codeview_annotation --profile release -- --color always --save-baseline release
      - name: Run CodeView annotation debug benchmark
        run: |
          $manifest = ".\runtime-bench\Cargo.toml"
          cargo +nightly bench --color always --manifest-path $manifest --bench codeview_annotation --profile dev -- --color always --baseline release
      - name: Upload Criterion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-benchmark-results
          path: runtime-bench/target/criterion
          if-no-files-found: warn
