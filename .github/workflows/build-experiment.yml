name: Build experiment
on:
  push:
    branches:
      - github-action-run
  workflow_dispatch:
    inputs:
      driver_set:
        description: Drivers to measure
        type: choice
        options:
          - All
          - NonDummy
          - Dummy
        default: All
permissions:
  contents: read
jobs:
  experiment:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout performance samples
        uses: actions/checkout@v5
      - name: Checkout WDR and its build setup
        uses: actions/checkout@v5
        with:
          repository: krishnakumar4a4/windows-drivers-rs
          ref: wdf-wpp-rust-native-frontend-impl-3
          path: .github/wdr
      # Upstream's composite actions use nested ./.github/actions paths.
      - name: Make upstream setup actions available
        run: Copy-Item -Recurse .github/wdr/.github/actions .github/actions
      - name: Enable long Git paths
        run: git config --global core.longpaths true
      - name: Install latest nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install LLVM
        run: |
          $version = '17.0.6'
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
          $installerUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installer

          $expectedHash = '89dc351af8e8fa1cafc6b48411e608aa9457c930a10f984aad5d21ab020165b2'
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "LLVM installer SHA-256 mismatch: $actualHash" }

          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installer failed with exit code $($process.ExitCode)" }

          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          $clang = Join-Path $llvmBin 'clang.exe'
          if (-not (Test-Path $clang)) { throw "LLVM installation not found at $clang" }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $clang --version
      - name: Install WDK
        uses: ./.github/actions/install-wdk
        with:
          version: 10.0.26100
          source: nuget
          host: amd64
          target: amd64
      - name: Install cargo-wdk from WDR branch
        run: cargo +nightly install --path .github/wdr/crates/cargo-wdk --locked --force
      - name: Install measureme summarize
        run: cargo +nightly install --git https://github.com/rust-lang/measureme --locked --force summarize
      - name: Run build experiment 2
        env:
          DRIVER_SET: ${{ inputs.driver_set || 'All' }}
        run: |
          # Temporarily disabled:
          # .\run-build-experiment.ps1 -Toolchain nightly -WdkBuild -DriverSet $env:DRIVER_SET -ResultsCsv build-experiment-results.csv
          .\run-build-experiment-2.ps1 -Toolchain nightly -WdkBuild -DriverSet $env:DRIVER_SET -ResultsCsv build-experiment-2-wdk.csv -AggregateOutput build-experiment-2-wdk-aggregate.txt
      - name: Print profiling results
        if: always()
        run: |
          $resultsCsv = "build-experiment-2-wdk.csv"
          $aggregateOutput = "build-experiment-2-wdk-aggregate.txt"

          if (Test-Path $resultsCsv) {
            Write-Host "::group::Build times and binary sizes"
            Import-Csv $resultsCsv |
              Format-Table -AutoSize Driver,
                @{ Label = "Build time (s)"; Expression = { "{0:N1}" -f [double]$_.BuildSeconds } },
                @{ Label = "Binary"; Expression = { Split-Path $_.Binary -Leaf } },
                @{ Label = "Binary bytes"; Expression = { "{0:N0}" -f [long]$_.BinaryBytes } } |
              Out-String -Width 240 |
              Write-Host
            Write-Host "::endgroup::"
          } else {
            Write-Warning "Build results were not generated at $resultsCsv"
          }

          if (Test-Path $aggregateOutput) {
            Write-Host "::group::Aggregated compiler profiling results"
            Get-Content $aggregateOutput | Write-Host
            Write-Host "::endgroup::"
          } else {
            Write-Warning "Aggregated profiling results were not generated at $aggregateOutput"
          }
      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-experiment-2-wdk-results
          path: |
            build-experiment-2-wdk.csv
            build-experiment-2-wdk-aggregate.txt
          if-no-files-found: warn